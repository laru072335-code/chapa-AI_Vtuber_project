[workspace]
name = "training_aienv"
channels = ["conda-forge"]
platforms = ["osx-arm64", "win-64"]

[dependencies]
python = "3.9.*"
pip = "*"
# システム依存のライブラリ
openssl = "*"
ca-certificates = "*"

[pypi-dependencies]
# 主要なライブラリのみ記述（依存関係はpixiが自動で解決します）
flask = "==3.1.3"
flask-cors = "*"
py-feat = "==0.6.2"
deepface = "==0.0.99"
tensorflow = "==2.17.1"
tf-keras = "==2.17.0"
torch = "==2.8.0"
torchvision = "==0.23.0"
opencv-python = "==4.11.0.86"
pandas = "==2.3.3"
numpy = "==1.23.5"
scikit-learn = "==1.6.1"
matplotlib = "==3.9.4"
gunicorn = "*"
python-dotenv = "*"
